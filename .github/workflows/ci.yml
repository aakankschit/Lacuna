name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # No third-party dependencies: the cost tools and hooks must work on a bare Python.
      # A scrubbed environment, matching tools/check.sh: no rich, no tmux, no author's HOME.
      # The suite must not depend on what happens to be installed on the runner.
      - name: Tests (unit, module, pipeline)
        run: |
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/clean" LANG=en_US.UTF-8 \
            "$(command -v python)" -m unittest discover -s tests -v

